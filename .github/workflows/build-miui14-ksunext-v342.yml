name: Build sweet MIUI 14 KSU-Next v3.4.0-legacy (driver 33355, spoofed manager)

# Same proven pipeline as build-miui14-ksu.yml, but:
#   - KSU-Next tree: v3.4.0-legacy tag (old hook engine, works on 4.14 AAPCS syscalls)
#   - Driver version pinned to 33355 via KSU_VERSION_OVERRIDE so it EXACTLY matches
#     the KernelSU-Next v3.4.2-spoofed manager (versionCode 33355, signature hash
#     79e590113c4c... baked into legacy Kbuild defaults — verified against APK).
#   - Manual hooks (CONFIG_KSU_MANUAL_HOOK) like the proven 12797 build; KPROBES
#     stays OFF because stock vendor .ko struct module sizes must not change.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        clang: [proton13]
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libncurses-dev libssl-dev lz4 python3 xsltproc zip zlib1g-dev libxml2-utils

      - name: Toolchains (clang + Android gcc-4.9 binutils 2.27, same linker family as stock)
        run: |
          if [ "${{ matrix.clang }}" = "proton13" ]; then
            git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          else
            git clone --depth=1 -b lineage-20.0 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          fi
          rm -f clang/bin/as
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
          mkdir -p tc64 tc32
          for t in gcc64/bin/aarch64-linux-android-*; do ln -sf "$PWD/$t" tc64/; done
          ln -sf "$PWD/gcc64/bin/aarch64-linux-android-as" tc64/as
          for t in gcc32/bin/arm-linux-androideabi-*; do ln -sf "$PWD/$t" tc32/; done
          ln -sf "$PWD/gcc32/bin/arm-linux-androideabi-as" tc32/as
          clang/bin/clang --version | head -1
          tc64/aarch64-linux-android-ld --version | head -1
          tc64/as --version | head -1

      - name: Clone MiCode sweet-r-oss (official MIUI 12.5 / Android 11 source, 4.14.180)
        run: |
          git clone --depth=1 -b sweet-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          head -4 kernel/Makefile
          sed -i 's/^SUBLEVEL = 180/SUBLEVEL = 190/' kernel/Makefile
          grep -E "^SUBLEVEL" kernel/Makefile

      - name: Integrate KernelSU-Next v3.4.0-legacy (manual-hook tree)
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.4.0-legacy/kernel/setup.sh" | bash -s v3.4.0-legacy
          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          # sanity: legacy tree must not depend on KPROBES after compat patch
          python3 "$GITHUB_WORKSPACE/scripts/ksu_v342_compat.py" KernelSU-Next/kernel

      - name: Backport path_umount (KSU-Next needs it; upstream since 5.9)
        working-directory: kernel
        run: |
          python3 - <<'PYEOF'
          import sys, textwrap
          f = "fs/namespace.c"
          s = open(f).read()
          if "int path_umount(" in s:
              print("path_umount already present"); sys.exit(0)
          anchor = "SYSCALL_DEFINE2(umount"
          if anchor not in s:
              print("umount anchor NOT FOUND"); sys.exit(1)
          code = textwrap.dedent("""
          static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }

          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);

          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }

          """)
          i = s.index(anchor)
          open(f, "w").write(s[:i] + code + s[i:])
          print("path_umount backported")
          PYEOF

      - name: KSU-Next legacy manual hooks (exec/faccessat/stat/read/reboot)
        working-directory: kernel
        run: python3 "$GITHUB_WORKSPACE/scripts/ksu_legacy_manual_hooks.py"

      - name: Relax modversions (stock vendor .ko audio/wlan/fpc) with struct-module size guard
        working-directory: kernel
        run: python3 "$GITHUB_WORKSPACE/scripts/relax_modversions.py"

      - name: Build kernel
        working-directory: kernel
        run: |
          set -o pipefail
          W="$GITHUB_WORKSPACE"
          # Match stock MIUI kernel /proc/version exactly (RASPs flag custom-kernel-on-stock-ROM via build date/builder/compiler mismatch)
          export KBUILD_BUILD_USER=builder KBUILD_BUILD_HOST=pangu-build-component-vendor-57549-9mvqs-bmgdd-gdkdh
          export KBUILD_BUILD_TIMESTAMP="Mon Mar 27 07:20:51 UTC 2023"
          sed -i 's#^\( *\)CC_VERSION=.*#\1CC_VERSION="clang version 10.0.7 for Android NDK"#' scripts/mkcompile_h
          grep -n "CC_VERSION=" scripts/mkcompile_h
          MFLAGS="O=out ARCH=arm64 \
            CC=$W/clang/bin/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$W/tc64/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$W/tc32/arm-linux-androideabi- \
            KCFLAGS=-Wno-error \
            KSU_VERSION_OVERRIDE=33355"
          mkdir -p out
          cp "$W/configs/miui14_stock.config" out/.config
          ./scripts/config --file out/.config \
            -e CONFIG_KSU -d CONFIG_KSU_KPROBES_HOOK -e CONFIG_KSU_MANUAL_HOOK -d CONFIG_KPROBES \
            -d CONFIG_LOCALVERSION_AUTO --set-str CONFIG_LOCALVERSION "-perf-g019d15b3d168" \
            -e CONFIG_TOUCHSCREEN_GOODIX_GTX9896_I2C -e CONFIG_TOUCHSCREEN_GOODIX_GTX9896_UPDATE \
            -e CONFIG_TOUCHSCREEN_GOODIX_GTX9896_GESTURE -e CONFIG_TOUCHSCREEN_GOODIX_GTX9896_TOOLS \
            -e CONFIG_NEW_TOUCH_GAMEMODE \
            -d CONFIG_KSU_ALLOWLIST_WORKAROUND \
            -d CONFIG_IKCONFIG_PROC -d CONFIG_IKCONFIG
          make $MFLAGS olddefconfig
          echo "=== key config ==="
          grep -E "^CONFIG_KSU|KSU_MANUAL_HOOK|KSU_KPROBES|KPROBES|^CONFIG_MODVERSIONS|STACKPROTECTOR_STRONG|^CONFIG_LOCALVERSION|LOCALVERSION_AUTO" out/.config
          grep -q "^CONFIG_KSU=y" out/.config || { echo "KSU NOT ENABLED"; exit 1; }
          grep -q "^CONFIG_KSU_MANUAL_HOOK=y" out/.config || { echo "MANUAL_HOOK NOT ENABLED (wrong hook mode)"; exit 1; }
          if grep -q "^CONFIG_KPROBES=y" out/.config; then echo "KPROBES must stay off"; exit 1; fi
          if grep -q "^CONFIG_IKCONFIG_PROC=y" out/.config; then echo "IKCONFIG_PROC still on -> /proc/config.gz would leak CONFIG_KSU"; exit 1; fi
          grep -q "^CONFIG_TOUCHSCREEN_GOODIX_GTX9896_I2C=y" out/.config || { echo "TOUCH DRIVER (GTX9896_I2C) NOT ENABLED"; exit 1; }
          make -j$(nproc) $MFLAGS Image.gz 2>&1 | tee "$W/build.log"
          REL=$(cat out/include/config/kernel.release)
          echo "kernel.release = $REL"
          [ "$REL" = "4.14.190-perf-g019d15b3d168" ] || { echo "release string does not match stock"; exit 1; }
          grep -q "KernelSU-Next version: 33355" "$W/build.log" || { echo "DRIVER VERSION MISMATCH (must be 33355)"; exit 1; }
          ls -la out/arch/arm64/boot/Image.gz

      - name: Package AnyKernel3 (replaces only the kernel in stock MIUI boot; keeps ramdisk+dtb)
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          rm -rf AK3/.git
          cp kernel/out/arch/arm64/boot/Image.gz AK3/Image.gz
          cat > AK3/anykernel.sh <<'AKEOF'
          properties() { '
          kernel.string=sweet MIUI 14 KSU-Next v3.4.0-legacy (33355, manual hooks, 4.14.190)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=sweet
          device.name2=sweetin
          device.name3=
          supported.versions=
          supported.patchlevels=
          '; }
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AKEOF
          cd AK3 && zip -r9 "../sweet-miui14-ksunext-v342-${{ matrix.clang }}.zip" * -x .git\* README.md && cd ..
          mkdir -p artifact
          cp sweet-miui14-ksunext-v342-*.zip artifact/
          cp kernel/out/.config artifact/kernel_config_used
          cp build.log artifact/
          echo "MiCode sweet-r-oss + stock MIUI14 config + KernelSU-Next v3.4.0-legacy (KSU_VERSION_OVERRIDE=33355) manual hooks; clang=${{ matrix.clang }}; GNU binutils 2.27 (aarch64-linux-android-4.9); release 4.14.190-perf-g019d15b3d168" > artifact/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweet-miui14-ksunext-v342-${{ matrix.clang }}
          path: artifact/
          retention-days: 30
