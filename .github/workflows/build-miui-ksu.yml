name: Build sweet MIUI 12.5 KSU-Next (MiCode sweet-r-oss)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git libelf-dev libncurses-dev libssl-dev lz4 python3 schedtool xsltproc zip zlib1g-dev libxml2-utils aria2

      - name: Download Proton Clang (clang 13 — matches 4.14 era, bundles lld + aarch64/arm gnu binutils)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang proton
          proton/bin/clang --version | head -1
          proton/bin/ld.lld --version | head -1
          ls proton/bin/aarch64-linux-gnu-ld proton/bin/arm-linux-gnueabi-ld

      - name: Clone MiCode sweet-r-oss (official MIUI 12.5 / Android 11 source, 4.14.180)
        run: |
          git clone --depth=1 -b sweet-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          cd kernel
          echo "=== kernel version ==="; head -3 Makefile
          echo "=== sweet defconfigs ==="; ls arch/arm64/configs/ | grep sweet

      - name: Integrate KernelSU-Next v1.0.9 (driver 12797)
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v1.0.9/kernel/setup.sh" | bash -s v1.0.9
          grep -q kernelsu drivers/Makefile && echo "drivers/Makefile wired" || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig && echo "drivers/Kconfig wired" || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Configure defconfig (KSU, keep SELinux enforcing)
        working-directory: kernel
        run: |
          DC=arch/arm64/configs/sweet_user_defconfig
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_MODULES=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
          } >> "$DC"
          echo "appended KSU to $DC"

      - name: Build kernel (Proton Clang, enforcing, -Wno-error)
        working-directory: kernel
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/proton/bin:$PATH"
          export KBUILD_BUILD_USER=sikandar KBUILD_BUILD_HOST=sweet-miui-ksu
          clang --version | head -1
          # 4.14 forces clang to an external 'as' (-no-integrated-as) which picks a wrong assembler
          # (proton/bin/as: unrecognized option '-EL'). Force clang's integrated assembler instead.
          grep -rl -- "-no-integrated-as" Makefile arch/arm64/ scripts/ 2>/dev/null | xargs -r sed -i 's/-no-integrated-as/-integrated-as/g'
          echo "no-integrated-as occurrences left: $(grep -r -- '-no-integrated-as' Makefile arch/arm64/ scripts/ 2>/dev/null | wc -l)"
          MFLAGS="O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS='-Wno-error -integrated-as' \
            KAFLAGS=-integrated-as"
          make $MFLAGS sweet_user_defconfig
          # KSU on; disable stackprotector (clang fails the gcc-style prepare-compiler-check); disable broken-asm forced checks
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -d CONFIG_CC_STACKPROTECTOR_REGULAR \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_CC_STACKPROTECTOR \
            -d CONFIG_STACKPROTECTOR_STRONG \
            -d CONFIG_STACKPROTECTOR \
            -e CONFIG_CC_STACKPROTECTOR_AUTO 2>/dev/null || true
          make $MFLAGS olddefconfig
          echo "=== KSU + stackprotector in config ==="; grep -E "CONFIG_KSU=|STACKPROTECTOR" out/.config | head
          make -j$(nproc) $MFLAGS Image.gz dtbs 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "=== boot output ==="; ls -la out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image.gz || { echo "Image.gz NOT produced"; exit 1; }

      - name: Package AnyKernel3 (replaces kernel in stock MIUI boot, keeps ramdisk+dtb)
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          rm -rf AK3/.git
          cp kernel/out/arch/arm64/boot/Image.gz AK3/Image.gz
          rm -f AK3/anykernel.sh
          cat > AK3/anykernel.sh <<'AKEOF'
          properties() { '
          kernel.string=sweet MIUI 12.5 KSU-Next driver 12797
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=sweet
          device.name2=sweetin
          device.name3=
          supported.versions=
          supported.patchlevels=
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AKEOF
          cd AK3
          zip -r9 ../sweet-miui125-ksunext-AnyKernel3.zip * -x .git\* README.md
          cd ..
          ls -la sweet-miui125-ksunext-AnyKernel3.zip

      - name: Collect artifact
        run: |
          mkdir -p artifact
          cp sweet-miui125-ksunext-AnyKernel3.zip artifact/ 2>/dev/null || true
          cp kernel/out/.config artifact/kernel_config_used 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build.log" artifact/ 2>/dev/null || true
          echo "MiCode sweet-r-oss (4.14.180, MIUI12.5/A11) + KernelSU-Next v1.0.9 (driver 12797), SELinux ENFORCING, Proton Clang 13" > artifact/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweet-miui125-ksunext
          path: artifact/
          retention-days: 30
