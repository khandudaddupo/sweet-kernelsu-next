name: Build sweet MIUI 12.5 KSU-Next (MiCode sweet-r-oss)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install build deps + aarch64/arm GNU cross binutils (real 'as' that handles -EL)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git libelf-dev libncurses-dev libssl-dev lz4 python3 schedtool xsltproc zip zlib1g-dev libxml2-utils aria2 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          which aarch64-linux-gnu-elfedit aarch64-linux-gnu-as

      - name: Download Proton Clang (clang 13, for CC + ld.lld + llvm-*)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang proton
          proton/bin/clang --version | head -1

      - name: Clone MiCode sweet-r-oss (official MIUI 12.5 / Android 11 source, 4.14.180)
        run: |
          git clone --depth=1 -b sweet-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          cd kernel
          head -3 Makefile; ls arch/arm64/configs/ | grep sweet

      - name: Integrate KernelSU-Next v1.0.9 (driver 12797)
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v1.0.9/kernel/setup.sh" | bash -s v1.0.9
          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: Build kernel (clang CC + external GNU as via aarch64-linux-gnu-, ld.lld, enforcing)
        working-directory: kernel
        run: |
          set -o pipefail
          # proton for clang/ld.lld/llvm-*, /usr/bin for aarch64-linux-gnu-* binutils (real as, understands -EL)
          export PATH="$GITHUB_WORKSPACE/proton/bin:/usr/bin:$PATH"
          export KBUILD_BUILD_USER=sikandar KBUILD_BUILD_HOST=sweet-miui-ksu
          # proton/bin/as is a wrong/generic assembler (rejects -EL). clang picks it up for target .o.
          # Point proton's as (and prefixed as) at the real GNU aarch64/arm assemblers.
          ln -sf "$(command -v aarch64-linux-gnu-as)" "$GITHUB_WORKSPACE/proton/bin/as"
          ln -sf "$(command -v aarch64-linux-gnu-as)" "$GITHUB_WORKSPACE/proton/bin/aarch64-linux-gnu-as"
          ln -sf "$(command -v arm-linux-gnueabi-as)" "$GITHUB_WORKSPACE/proton/bin/arm-linux-gnueabi-as" 2>/dev/null || true
          ls -l "$GITHUB_WORKSPACE/proton/bin/as"
          clang --version | head -1; aarch64-linux-gnu-as --version | head -1
          MFLAGS="O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS=-Wno-error"
          make $MFLAGS sweet_user_defconfig
          # KSU on; stackprotector off (clang fails the gcc-style prepare-compiler-check)
          ./scripts/config --file out/.config -e CONFIG_KSU \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -d CONFIG_CC_STACKPROTECTOR_REGULAR -e CONFIG_CC_STACKPROTECTOR_NONE
          make $MFLAGS olddefconfig
          grep -E "CONFIG_KSU=|STACKPROTECTOR" out/.config | head
          make -j$(nproc) $MFLAGS Image.gz dtbs 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          ls -la out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image.gz || { echo "Image.gz NOT produced"; exit 1; }

      - name: Package AnyKernel3 (replaces kernel in stock MIUI boot, keeps ramdisk+dtb)
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          rm -rf AK3/.git
          cp kernel/out/arch/arm64/boot/Image.gz AK3/Image.gz
          rm -f AK3/anykernel.sh
          cat > AK3/anykernel.sh <<'AKEOF'
          properties() { '
          kernel.string=sweet MIUI 12.5 KSU-Next driver 12797
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=sweet
          device.name2=sweetin
          device.name3=
          supported.versions=
          supported.patchlevels=
          '; }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AKEOF
          cd AK3
          zip -r9 ../sweet-miui125-ksunext-AnyKernel3.zip * -x .git\* README.md
          cd ..
          ls -la sweet-miui125-ksunext-AnyKernel3.zip

      - name: Collect artifact
        run: |
          mkdir -p artifact
          cp sweet-miui125-ksunext-AnyKernel3.zip artifact/ 2>/dev/null || true
          cp kernel/out/.config artifact/kernel_config_used 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build.log" artifact/ 2>/dev/null || true
          echo "MiCode sweet-r-oss (4.14.180, MIUI12.5/A11) + KernelSU-Next v1.0.9 (driver 12797), SELinux ENFORCING, Proton Clang CC + external aarch64-linux-gnu as + ld.lld" > artifact/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweet-miui125-ksunext
          path: artifact/
          retention-days: 30
