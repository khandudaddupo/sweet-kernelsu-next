name: Build sweet KernelSU-Next (PixelOS source, proven recipe)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 bc bison build-essential ccache cpio flex git libelf-dev libncurses-dev libssl-dev lz4 python3 schedtool xsltproc zip zlib1g-dev libxml2-utils python-is-python3 jq

      - name: Setup Toolchains (ZyCromerZ Clang 17 + greenforce GCC)
        run: |
          mkdir -p clang
          aria2c -q -s 16 -x 16 "https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang/
          rm -f clang.tar.gz
          git clone --depth=1 https://github.com/greenforce-project/gcc-arm64 -b main gcc64
          git clone --depth=1 https://github.com/greenforce-project/gcc-arm -b main gcc32
          ls clang/bin/clang gcc64/bin/aarch64-elf-ld gcc32/bin/arm-none-eabi-gcc

      - name: Clone Kernel Source (PixelOS sm6150, Android 13 era)
        run: |
          git clone --depth=1 -b seventeen https://github.com/PixelOS-Devices/android_kernel_xiaomi_sm6150.git kernel
          cd kernel
          ls arch/arm64/configs/ | grep sweet

      - name: Setup KernelSU-Next (legacy-susfs via proven patch script)
        working-directory: kernel
        run: |
          python3 $GITHUB_WORKSPACE/scripts/patch_ksu_susfs.py \
            --ksu-repo "https://github.com/xtrance-eng/KernelSU-Next.git" \
            --ksu-branch "legacy-susfs"
          test -L drivers/kernelsu && echo "kernelsu symlink OK"
          grep -q kernelsu drivers/Makefile || { echo "Makefile not patched"; exit 1; }

      - name: Compile Kernel Image
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          export KBUILD_BUILD_USER="sikandar"
          export KBUILD_BUILD_HOST="sweet-kernelsu"

          make O=out ARCH=arm64 sweet_defconfig

          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KPROBES \
            -e CONFIG_KRETPROBES \
            -e CONFIG_KSU_KPROBES_HOOK \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_SUS_MAP \
            -e CONFIG_NOMOUNT \
            -d CONFIG_HZ_100 \
            -e CONFIG_HZ_300 \
            --set-val CONFIG_HZ 300 \
            -e CONFIG_JUMP_LABEL \
            -e CONFIG_WQ_POWER_EFFICIENT_DEFAULT \
            -e CONFIG_TCP_CONG_ADVANCED \
            -e CONFIG_TCP_CONG_BBR \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr" \
            -e CONFIG_NET_SCH_FQ \
            -d CONFIG_PROFILING

          make O=out ARCH=arm64 olddefconfig

          echo "--- KSU config check ---"
          grep -E "^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KRETPROBES)" out/.config | head -20

          make -j$(nproc --all) O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$GITHUB_WORKSPACE/gcc64/bin/aarch64-elf- \
            CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc32/bin/arm-none-eabi- \
            Image.gz dtbs 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          echo "--- outputs ---"
          ls -lh out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/*.dtb 2>/dev/null || ls -lh out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image.gz || { echo "No Image.gz built"; exit 1; }

      - name: Package artifact
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image.gz artifact/
          cp kernel/out/.config artifact/kernel_config_used
          ( cd kernel && git log --oneline -1 > "$GITHUB_WORKSPACE/artifact/kernel_commit.txt" )
          echo "PixelOS sm6150 seventeen + xtrance KernelSU-Next legacy-susfs + sweet_defconfig + ZyCromerZ Clang 17" > artifact/build-info.txt
          ls -lh artifact/
          cp "$GITHUB_WORKSPACE/build.log" artifact/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweet-kernelsu-pixelos
          path: artifact/
          retention-days: 14
