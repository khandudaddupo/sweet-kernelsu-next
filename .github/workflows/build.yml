name: Build sweet KernelSU-Next (manual hooks, zero config changes)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git libelf-dev libncurses-dev libssl-dev lz4 python3 schedtool xsltproc zip zlib1g-dev libxml2-utils

      - name: Download toolchain (NDK r21e clang 10.0.7 - matches stock)
        run: |
          curl -sL "https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip" -o ndk.zip
          unzip -q ndk.zip
          NDK_BIN="$PWD/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls "$NDK_BIN/clang" && "$NDK_BIN/clang" --version | head -1
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32
          ls gcc64/bin/aarch64-linux-android-ld gcc32/bin/arm-linux-androideabi-gcc

      - name: Clone Kernel Source (MiCode sweet-r-oss)
        run: |
          git clone --depth=1 -b sweet-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          cd kernel
          ls arch/arm64/configs/ | grep sweet

      - name: Setup KernelSU-Next v3.2.0-legacy + Manual Hooks
        working-directory: kernel
        run: |
          # Clone KSU-Next
          git clone --depth=1 -b v3.2.0-legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          
          # Create symlink
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          
          # Add to Makefile
          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          
          # Add to Kconfig
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          
          # Verify
          test -L drivers/kernelsu && echo "symlink OK"
          grep -q kernelsu drivers/Makefile && echo "Makefile OK"
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig && echo "Kconfig OK"
          
          # Apply manual hook patches (ZERO config changes!)
          python3 $GITHUB_WORKSPACE/scripts/patch_manual_hooks.py
          
          # Verify hooks
          grep -q "ksu_handle_sys_reboot" kernel/reboot.c && echo "reboot.c marker OK"
          grep -q "ksu_handle_execveat_sucompat" fs/exec.c && echo "exec hook OK"
          grep -q "ksu_handle_faccessat" fs/open.c && echo "faccessat hook OK"
          grep -q "ksu_handle_setresuid" kernel/sys.c && echo "setresuid hook OK"

      - name: Build kernel (stock config + KSU only)
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          NDK_BIN="$GITHUB_WORKSPACE/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          export KBUILD_BUILD_USER=sikandar
          export KBUILD_BUILD_HOST=sweet-kernelsu

          # Use stock defconfig - NO changes except what KSU needs
          make O=out ARCH=arm64 sweet_user_defconfig
          
          # Only enable KSU (manual hook mode - default when KPROBES is off)
          # DO NOT enable KPROBES, FTRACE, FTRACE_SYSCALLS - keep stock!
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --disable CONFIG_KSU_MANUAL_HOOK
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK
          make O=out ARCH=arm64 olddefconfig
          
          # Verify: config should be 99% stock
          echo "=== KSU config ==="
          grep -E "^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_FTRACE_SYSCALLS)" out/.config
          echo "=== KPROBES should be NOT SET ==="
          grep "CONFIG_KPROBES" out/.config
          echo "=== FTRACE_SYSCALLS should be NOT SET ==="
          grep "CONFIG_FTRACE_SYSCALLS" out/.config

          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=aarch64-linux-android-ld 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          echo "--- outputs ---"
          ls -lh out/arch/arm64/boot/Image.gz 2>/dev/null || ls -lh out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image.gz || test -f out/arch/arm64/boot/Image || { echo "No kernel built"; exit 1; }

      - name: Package artifact
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || cp kernel/out/arch/arm64/boot/Image artifact/ || true
          cp kernel/out/.config artifact/kernel_config_used
          ( cd kernel && git log --oneline -1 > "$GITHUB_WORKSPACE/artifact/kernel_commit.txt" )
          echo "sweet-r-oss + KSU v3.2.0-legacy MANUAL HOOKS + stock config (ZERO changes) + NDK clang 10.0.7" > artifact/build-info.txt
          ls -lh artifact/
          cp "$GITHUB_WORKSPACE/build.log" artifact/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweet-ksu-manual-hooks
          path: artifact/
          retention-days: 14
