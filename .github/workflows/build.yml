name: Build sweet KSU (PixelOS Android-13 source + manual hooks + zero config)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git libelf-dev libncurses-dev libssl-dev lz4 python3 schedtool xsltproc zip zlib1g-dev libxml2-utils

      - name: Download toolchains (ZyCromerZ Clang 17 + greenforce GCC)
        run: |
          sudo apt-get install -y aria2
          mkdir -p clang
          aria2c -q -s 16 -x 16 "https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang/
          rm -f clang.tar.gz
          git clone --depth=1 https://github.com/greenforce-project/gcc-arm64 -b main gcc64
          git clone --depth=1 https://github.com/greenforce-project/gcc-arm -b main gcc32
          ls clang/bin/clang gcc64/bin/aarch64-elf-ld gcc32/bin/arm-none-eabi-gcc

      - name: Clone Kernel Source (PixelOS sm6150 Android 13 = DTB era match)
        run: |
          git clone --depth=1 -b seventeen https://github.com/PixelOS-Devices/android_kernel_xiaomi_sm6150.git kernel
          cd kernel
          ls arch/arm64/configs/ | grep sweet

      - name: Setup KSU-Next + Manual Hooks
        working-directory: kernel
        run: |
          git clone --depth=1 -b v3.2.0-legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          python3 $GITHUB_WORKSPACE/scripts/patch_manual_hooks.py
          grep -q "ksu_handle_sys_reboot" kernel/reboot.c && echo "reboot marker OK"
          grep -q "ksu_handle_execveat_sucompat" fs/exec.c && echo "exec hook OK"

      - name: Build kernel (PixelOS defconfig + KSU only, zero other changes)
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
          clang --version | head -1
          export KBUILD_BUILD_USER=sikandar
          export KBUILD_BUILD_HOST=sweet-kernelsu

          # PixelOS defconfig (Android 13 era - matches stock DTBs)
          make O=out ARCH=arm64 sweet_defconfig

          # ONLY KSU - no KPROBES, no FTRACE, nothing else
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK
          make O=out ARCH=arm64 olddefconfig

          echo "=== CRITICAL VERIFY ==="
          grep "CONFIG_KPROBES" out/.config || echo "KPROBES not found in config (OK)"
          grep "CONFIG_FTRACE_SYSCALLS" out/.config || echo "FTRACE_SYSCALLS not found (OK)"
          grep "CONFIG_KSU" out/.config || { echo "CONFIG_KSU MISSING!"; exit 1; }
          grep "CONFIG_KSU_MANUAL_HOOK" out/.config || { echo "MANUAL_HOOK MISSING!"; exit 1; }

          make -j$(nproc) O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$GITHUB_WORKSPACE/gcc64/bin/aarch64-elf- \
            CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc32/bin/arm-none-eabi- \
            Image.gz 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          test -f out/arch/arm64/boot/Image.gz && echo "Image.gz OK" || ls out/arch/arm64/boot/

      - name: Package artifact
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image.gz artifact/
          cp kernel/out/.config artifact/kernel_config_used
          echo "PixelOS sm6150 seventeen (Android 13) + KSU v3.2.0-legacy MANUAL HOOKS + sweet_defconfig + ZyCromerZ Clang 17 + greenforce GCC + LLVM=1" > artifact/build-info.txt
          cp "$GITHUB_WORKSPACE/build.log" artifact/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweet-ksu-pixelos-manual-hooks
          path: artifact/
          retention-days: 14
